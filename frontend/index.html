<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track your order</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
    main { max-width: 420px; margin: 60px auto; background: white;
           padding: 28px; border-radius: 10px; }
    input { width: 65%; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    #result { margin-top: 20px; padding: 14px; border-radius: 6px; display: none; }
    .ok { background: #e6f4ea; }
    .error { background: #fdecea; }
  </style>
</head>
<body>
  <main>
    <h1>Track your order</h1>
    <p>Enter your order number (try BT1042)</p>
    <input id="orderInput" type="text" placeholder="e.g. BT1042">
    <button id="trackButton">Track</button>
    <div id="result"></div>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const input = document.getElementById("orderInput");
    const button = document.getElementById("trackButton");
    const resultBox = document.getElementById("result");

    // Shows a successful result on the page
    function showResult(order) {
      resultBox.className = "ok";
      resultBox.style.display = "block";
      resultBox.textContent = order.item + " is: " + order.status;
    }

    // Shows an error message on the page
    function showError(message) {
      resultBox.className = "error";
      resultBox.style.display = "block";
      resultBox.textContent = message;
    }

    // Runs when the user clicks Track
    async function trackOrder() {
      const orderId = input.value.trim();
      if (orderId === "") {
        showError("Please enter an order number.");
        return;
      }

      // YOUR PART: call the API here
    }

    button.addEventListener("click", trackOrder);
  </script>
</body>
</html>
